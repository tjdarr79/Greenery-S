alias: Farm pH Out of Range
description: pH below 5.0 or above 7.75 in either zone
triggers:
  - entity_id:
      - sensor.greenery_s_farm_cultivation_ph
      - sensor.greenery_s_farm_nursery_ph
    below: 5.0
    for:
      minutes: 5
    trigger: numeric_state
  - entity_id:
      - sensor.greenery_s_farm_cultivation_ph
      - sensor.greenery_s_farm_nursery_ph
    above: 7.75
    for:
      minutes: 5
    trigger: numeric_state
actions:
  - data:
      title: ⚠️ pH Out of Range
      message: >-
        {{ trigger.to_state.name }} is at {{ trigger.to_state.state }} -
        outside 5.0-7.75 range. Check calibration or dosing system.
    action: notify.mobile_app_farm_phone
mode: single
