---
name: Greenery S Farm Bridge
version: "1.5.0"
slug: greenery_bridge
description: >-
  Publishes Freight Farms Greenery S sensors, relay states and Task Mode
  controls to Home Assistant over MQTT. Reads the farm's local Farmhand
  endpoint directly - no cloud subscription required for monitoring.
url: https://github.com/tjdarr79/Greenery-S
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto

# "want" rather than "need": Supervisor supplies the broker credentials
# automatically when the Mosquitto add-on is installed, but an external broker
# can still be used via the manual override options below.
services:
  - mqtt:want

# The farm controller is on the LAN, so the add-on needs normal network access.
host_network: false

# farm_name defaults to the name every install had before it was configurable.
# Supervisor fills a new option's default into EXISTING installs on upgrade, so
# any other default would silently rename an upgraded farm's device.
options:
  farm_name: Greenery S Farm
  farm_host: 192.168.200.200
  farm_port: 3001
  log_level: info
  log_farm_monitoring: false
  mqtt_host: ""
  mqtt_port: 0
  mqtt_user: ""
  mqtt_password: ""
  # Dosing tank level sensors, in farmhand's order. Each list is one entry per
  # tank. The names decide the entity IDs at first sight, like farm_name.
  dosing_tank_names:
    - Nutrient A
    - Nutrient B
    - pH Down
    - Boost / pH Up
  dosing_tank_inputs:
    - digital_1
    - digital_2
    - digital_3
    - digital_4
  dosing_tanks_enabled:
    - true
    - true
    - true
    - true
  dosing_level_low_value: 1
  dosing_level_window_s: 600
  dosing_sensor_fault_changes_per_hour: 20
  dosing_silent_days: 21

schema:
  farm_name: str(1,)
  farm_host: str
  farm_port: port
  log_level: list(debug|info|warning|error)
  log_farm_monitoring: bool
  mqtt_host: str?
  mqtt_port: int(0,65535)?
  mqtt_user: str?
  mqtt_password: password?
  dosing_tank_names:
    - str
  dosing_tank_inputs:
    - match(^digital_[0-9]+$)
  dosing_tanks_enabled:
    - bool
  dosing_level_low_value: int(0,1)
  dosing_level_window_s: int(60,3600)
  dosing_sensor_fault_changes_per_hour: int(1,3600)
  dosing_silent_days: int(1,365)
