# Labels for the Configuration tab. Without this file Supervisor shows the raw
# option keys.
configuration:
  farm_name:
    name: Farm name
    description: >-
      Names this farm in Home Assistant and in its alerts, so one person
      watching several farms can tell them apart. Set it BEFORE the first
      start: it decides the entity IDs (e.g. "Smith Farm" gives
      sensor.smith_farm_cultivation_ph), and changing it later does not
      rename existing IDs. Also set the Farm Name helper in Home Assistant to
      the same value.
  farm_host:
    name: Farm controller IP
    description: The Farmhand hub controller's address on the farm network.
  farm_port:
    name: Farm controller port
    description: Local Farmhand port. 3001 on a stock Greenery S.
  log_level:
    name: Log level
    description: Raise to debug when troubleshooting.
  log_farm_monitoring:
    name: Log farm-monitoring stream (investigation)
    description: >-
      Logs the first 20 events of farmhand's /farm-monitoring reply stream
      after each start. The app reads that stream either way; this only logs
      it. Leave off unless investigating.
  mqtt_host:
    name: MQTT broker host (override)
    description: >-
      Leave blank to use the Mosquitto app automatically. Fill in only for a
      broker outside Home Assistant.
  mqtt_port:
    name: MQTT broker port (override)
    description: 0 or blank means 1883.
  mqtt_user:
    name: MQTT username (override)
    description: Only for a broker outside Home Assistant.
  mqtt_password:
    name: MQTT password (override)
    description: Only for a broker outside Home Assistant.
  dosing_tank_names:
    name: Dosing tank names
    description: >-
      One per tank, in farmhand's order. They name the Level, Sensor Fault,
      Days Since Refill and Refilled entities. Like Farm name, set them before
      the first start: they decide the entity IDs, and the dashboards expect
      the defaults.
  dosing_tank_inputs:
    name: Dosing tank inputs
    description: >-
      Which digital input of module E831CDC7E680 each tank's level sensor is
      wired to, in the same order. Swap two here to fix a swapped wire.
  dosing_tanks_enabled:
    name: Dosing tanks in use
    description: >-
      One per tank. A tank turned off gets no entities and no alerts - for a
      farm not using tank 4.
  dosing_level_low_value:
    name: Dosing tank low reads
    description: >-
      The raw input value that means "tank low". 1 unless Home Assistant shows
      the opposite of farmhand - then set 0. See DOCS, "Dosing tank levels".
  dosing_level_window_s:
    name: Dosing tank level window (seconds)
    description: >-
      Low means 80% of the readings in this window read low; ok means 20% or
      fewer. Longer is steadier and slower.
  dosing_sensor_fault_changes_per_hour:
    name: Dosing tank Sensor Fault above (changes/hour)
    description: >-
      A sensor whose reading flips more often than this in an hour - usually
      a corroded connector - raises its Sensor Fault and its level is held.
  dosing_silent_days:
    name: Dosing tank silent-sensor alert after (days)
    description: >-
      A tank that has not reported low, and has had no Refilled press, in this
      many days sends a reminder to check its sensor. A dead sensor reads ok.
