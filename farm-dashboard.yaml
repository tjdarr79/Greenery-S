title: Greenery S Farm
views:
  - title: Farm Overview
    path: farm-overview
    icon: mdi:sprout
    type: panel
    cards:
      - type: vertical-stack
        cards:
          # -----------------------------------------------------------------
          # BRIDGE STATUS - check this first: if offline, every panel below
          # is showing stale/last-known data, not live readings.
          # -----------------------------------------------------------------
          - type: entity
            entity: binary_sensor.greenery_s_farm_farm_bridge_status
            name: Bridge Status
            icon: mdi:connection

          # -----------------------------------------------------------------
          # THREE PANELS SIDE BY SIDE, FULL WIDTH
          # -----------------------------------------------------------------
          - type: horizontal-stack
            cards:
              # PANEL 1: ENVIRONMENTAL, with the dosing tanks below it
              - type: vertical-stack
                cards:
                  - type: entities
                    title: Environmental
                    icon: mdi:thermometer
                    show_header_toggle: false
                    entities:
                      - entity: sensor.greenery_s_farm_farm_co2
                        name: CO2
                      - entity: sensor.greenery_s_farm_farm_humidity
                        name: Humidity
                      - entity: sensor.greenery_s_farm_farm_air_temp
                        name: Air Temp

                  # DOSING TANKS - farmhand shows these under air temp / RH / CO2.
                  # OK, or Problem (red) when a tank is low. A dead or unplugged sensor
                  # ALSO reads OK - press Refilled after every refill, so the bridge can
                  # tell a working sensor from a silent one. See DOCS.md, "Dosing tank levels".
                  - type: entities
                    title: Dosing Tanks
                    icon: mdi:cup-water
                    state_color: true
                    show_header_toggle: false
                    entities:
                      - entity: binary_sensor.greenery_s_farm_nutrient_a_level
                        name: Nutrient A
                      - entity: binary_sensor.greenery_s_farm_nutrient_b_level
                        name: Nutrient B
                      - entity: binary_sensor.greenery_s_farm_ph_down_level
                        name: pH Down
                      - entity: binary_sensor.greenery_s_farm_boost_ph_up_level
                        name: Boost / pH Up
                      # A flickering sensor (corroded connector) - shown only while it is on.
                      - type: conditional
                        conditions:
                          - entity: binary_sensor.greenery_s_farm_nutrient_a_sensor_fault
                            state: "on"
                        row:
                          entity: binary_sensor.greenery_s_farm_nutrient_a_sensor_fault
                          name: Nutrient A sensor unstable
                      - type: conditional
                        conditions:
                          - entity: binary_sensor.greenery_s_farm_nutrient_b_sensor_fault
                            state: "on"
                        row:
                          entity: binary_sensor.greenery_s_farm_nutrient_b_sensor_fault
                          name: Nutrient B sensor unstable
                      - type: conditional
                        conditions:
                          - entity: binary_sensor.greenery_s_farm_ph_down_sensor_fault
                            state: "on"
                        row:
                          entity: binary_sensor.greenery_s_farm_ph_down_sensor_fault
                          name: pH Down sensor unstable
                      - type: conditional
                        conditions:
                          - entity: binary_sensor.greenery_s_farm_boost_ph_up_sensor_fault
                            state: "on"
                        row:
                          entity: binary_sensor.greenery_s_farm_boost_ph_up_sensor_fault
                          name: Boost / pH Up sensor unstable
                      - type: section
                        label: Days since refill
                      - entity: sensor.greenery_s_farm_nutrient_a_days_since_refill
                        name: Nutrient A
                      - entity: sensor.greenery_s_farm_nutrient_b_days_since_refill
                        name: Nutrient B
                      - entity: sensor.greenery_s_farm_ph_down_days_since_refill
                        name: pH Down
                      - entity: sensor.greenery_s_farm_boost_ph_up_days_since_refill
                        name: Boost / pH Up

                  # Refilled: one tap per tank, each confirmed.
                  - type: grid
                    columns: 4
                    square: false
                    cards:
                      - type: button
                        show_name: true
                        show_icon: true
                        entity: button.greenery_s_farm_nutrient_a_refilled
                        name: Nutrient A
                        icon: mdi:water-plus
                        tap_action:
                          action: perform-action
                          perform_action: button.press
                          target:
                            entity_id: button.greenery_s_farm_nutrient_a_refilled
                          confirmation:
                            text: Nutrient A tank refilled? Resets its Days Since Refill to 0.
                        hold_action:
                          action: none
                      - type: button
                        show_name: true
                        show_icon: true
                        entity: button.greenery_s_farm_nutrient_b_refilled
                        name: Nutrient B
                        icon: mdi:water-plus
                        tap_action:
                          action: perform-action
                          perform_action: button.press
                          target:
                            entity_id: button.greenery_s_farm_nutrient_b_refilled
                          confirmation:
                            text: Nutrient B tank refilled? Resets its Days Since Refill to 0.
                        hold_action:
                          action: none
                      - type: button
                        show_name: true
                        show_icon: true
                        entity: button.greenery_s_farm_ph_down_refilled
                        name: pH Down
                        icon: mdi:water-plus
                        tap_action:
                          action: perform-action
                          perform_action: button.press
                          target:
                            entity_id: button.greenery_s_farm_ph_down_refilled
                          confirmation:
                            text: pH Down tank refilled? Resets its Days Since Refill to 0.
                        hold_action:
                          action: none
                      - type: button
                        show_name: true
                        show_icon: true
                        entity: button.greenery_s_farm_boost_ph_up_refilled
                        name: Boost
                        icon: mdi:water-plus
                        tap_action:
                          action: perform-action
                          perform_action: button.press
                          target:
                            entity_id: button.greenery_s_farm_boost_ph_up_refilled
                          confirmation:
                            text: Boost / pH Up tank refilled? Resets its Days Since Refill to 0.
                        hold_action:
                          action: none

              # PANEL 2: NURSERY
              - type: entities
                title: Nursery
                icon: mdi:seed
                show_header_toggle: false
                entities:
                  - entity: sensor.greenery_s_farm_nursery_ph
                    name: pH
                  - entity: sensor.greenery_s_farm_nursery_ec
                    name: EC
                  - entity: sensor.greenery_s_farm_nursery_water_temp
                    name: Water Temp
                  - entity: sensor.greenery_s_farm_nursery_depth
                    name: Tank Depth

              # PANEL 3: CULTIVATION
              - type: entities
                title: Cultivation
                icon: mdi:water
                show_header_toggle: false
                entities:
                  - entity: sensor.greenery_s_farm_cultivation_ph
                    name: pH
                  - entity: sensor.greenery_s_farm_cultivation_ec
                    name: EC
                  - entity: sensor.greenery_s_farm_cultivation_water_temp
                    name: Water Temp
                  - entity: sensor.greenery_s_farm_cultivation_depth_raw
                    name: Tank Depth (raw - needs calibration)
                  - entity: sensor.greenery_s_farm_left_send_pressure
                    name: Left Send Pressure
                  - entity: sensor.greenery_s_farm_right_send_pressure
                    name: Right Send Pressure

          # -----------------------------------------------------------------
          # TREND GRAPHS - 24hr history, one per zone plus environmental.
          # pH/EC trend matters most here: ties directly to tip-burn root
          # cause (calcium distribution, not deficiency) - a slow EC/pH
          # drift is the leading indicator, not a single bad reading.
          # -----------------------------------------------------------------
          - type: horizontal-stack
            cards:
              - type: history-graph
                title: Environmental Trends (24h)
                hours_to_show: 24
                refresh_interval: 60
                entities:
                  - entity: sensor.greenery_s_farm_farm_co2
                    name: CO2
                  - entity: sensor.greenery_s_farm_farm_humidity
                    name: Humidity
                  - entity: sensor.greenery_s_farm_farm_air_temp
                    name: Air Temp

              - type: history-graph
                title: Nursery Trends (24h)
                hours_to_show: 24
                refresh_interval: 60
                entities:
                  - entity: sensor.greenery_s_farm_nursery_ph
                    name: pH
                  - entity: sensor.greenery_s_farm_nursery_ec
                    name: EC
                  - entity: sensor.greenery_s_farm_nursery_water_temp
                    name: Water Temp

              - type: history-graph
                title: Cultivation Trends (24h)
                hours_to_show: 24
                refresh_interval: 60
                entities:
                  - entity: sensor.greenery_s_farm_cultivation_ph
                    name: pH
                  - entity: sensor.greenery_s_farm_cultivation_ec
                    name: EC
                  - entity: sensor.greenery_s_farm_cultivation_water_temp
                    name: Water Temp

          # -----------------------------------------------------------------
          # DEPTH TREND - separate graph: different scale (%) than
          # chemistry/climate above, and matters for spotting a stuck
          # autofill valve or dosing pump failure over time.
          # -----------------------------------------------------------------
          - type: history-graph
            title: Tank Depth Trends (24h)
            hours_to_show: 24
            refresh_interval: 60
            entities:
              - entity: sensor.greenery_s_farm_nursery_depth
                name: Nursery Depth
              - entity: sensor.greenery_s_farm_cultivation_depth_raw
                name: Cultivation Depth (raw)
