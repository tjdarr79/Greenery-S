# ---------------------------------------------------------------------------
# CONTROLS CARD - generic, shipped to every farm via render-farm-yaml.py.
# Controls only: no cameras here. Camera photos live on the main mobile
# dashboard (farm-dashboard-mobile.yaml), above Nursery and Cultivation.
# Farm-specific controls (Cool-Down) live in their own file, not here - see
# dashboard-cooldown.yaml.
#
# Add via Dashboard -> Edit -> Add Card -> Manual, then paste this block.
#
# TWO THINGS THAT WILL BITE YOU
#
# 1. `confirmation:` is not optional. Without it a mis-tap on a phone in your
#    pocket stops the farm. It is nested INSIDE tap_action.
#
# 2. The visual editor can emit a tap_action of `automation.trigger` with an
#    empty target, which silently does nothing. A button card driving a
#    `button` entity needs `perform_action: button.press` with an explicit
#    target.entity_id, exactly as written below.
#
# Entity IDs carry the device prefix. The doubled "farm" in the status sensor
# is correct: device "Greenery S Farm" + entity "Farm Control Status".
#
# Task Mode comes first: it is the control most likely to be reached for
# under stress, and "Key Equipment" right under it is what its buttons affect
# - watch these change when you press.
#
# "Pumps (Task Mode only)" and "Exhaust Fan (Task Mode only)" switch single
# outputs and are kept apart from the Task Mode buttons themselves. Their
# switches are unavailable unless the farm is in Task Mode. "24-Hour
# Settings" writes farmhand's own 24-hour flags and works in auto. To put any
# card elsewhere, cut its block into its own Manual card and remove its
# leading indentation.
#
# 3. A tile toggles its switch on an ICON tap by default - with no
#    confirmation. Every switch tile therefore sets icon_tap_action as well as
#    tap_action, both with `confirmation:`, and hold_action: none. Keep all
#    three when editing; verify-repo.py checks the first two.
# ---------------------------------------------------------------------------

type: vertical-stack
cards:
  - type: button
    show_name: true
    show_icon: true
    entity: button.greenery_s_farm_enter_task_mode
    name: EMERGENCY — Task Mode
    icon: mdi:hand-back-right
    tap_action:
      action: perform-action
      perform_action: button.press
      target:
        entity_id: button.greenery_s_farm_enter_task_mode
      confirmation:
        text: Put the farm in TASK MODE? Lights off, recipe suspended.

  - type: button
    show_name: true
    show_icon: true
    entity: button.greenery_s_farm_exit_task_mode
    name: Return to Auto
    icon: mdi:play-circle
    tap_action:
      action: perform-action
      perform_action: button.press
      target:
        entity_id: button.greenery_s_farm_exit_task_mode
      confirmation:
        text: Return the farm to automatic recipe control?

  # The status line is not decoration. It is how you know a press actually
  # took effect - the bridge verifies against the output board's own mode
  # field rather than trusting the HTTP 200.
  - type: entities
    title: Farm Control
    show_header_toggle: false
    entities:
      - entity: sensor.greenery_s_farm_farm_control_status
        name: Last command
      - entity: binary_sensor.greenery_s_farm_task_mode_active
        name: Task mode

  # Equipment the buttons affect. Watch these change when you press.
  - type: entities
    title: Key Equipment
    show_header_toggle: false
    entities:
      - entity: binary_sensor.greenery_s_farm_cultivation_recirc_pump
        name: Cultivation Recirc
      - entity: binary_sensor.greenery_s_farm_nursery_recirc_and_chiller_pump
        name: Nursery Recirc + Chiller
      - entity: binary_sensor.greenery_s_farm_hvac_cooling
        name: HVAC Cooling
      - entity: binary_sensor.greenery_s_farm_co2_regulator
        name: CO2 Regulator
      - entity: binary_sensor.greenery_s_farm_exhaust_fan
        name: Exhaust Fan

  # Task Mode only. Result of each press shows in "Last command" above:
  # CONFIRMED is read back from the relay, not from farmhand's reply.
  - type: grid
    title: Pumps (Task Mode only)
    columns: 1
    square: false
    cards:
      - type: tile
        entity: switch.greenery_s_farm_cultivation_recirc_pump_switch
        name: Cultivation Recirc Pump
        tap_action:
          action: toggle
          confirmation:
            text: Turn Cultivation Recirc Pump on/off?
        icon_tap_action:
          action: toggle
          confirmation:
            text: Turn Cultivation Recirc Pump on/off?
        hold_action:
          action: none

      - type: tile
        entity: switch.greenery_s_farm_left_send_pump_switch
        name: Left Send Pump
        tap_action:
          action: toggle
          confirmation:
            text: Turn Left Send Pump on/off?
        icon_tap_action:
          action: toggle
          confirmation:
            text: Turn Left Send Pump on/off?
        hold_action:
          action: none

      - type: tile
        entity: switch.greenery_s_farm_right_send_pump_switch
        name: Right Send Pump
        tap_action:
          action: toggle
          confirmation:
            text: Turn Right Send Pump on/off?
        icon_tap_action:
          action: toggle
          confirmation:
            text: Turn Right Send Pump on/off?
        hold_action:
          action: none

      # Also carries the chiller pump: off means the chiller loses flow.
      - type: tile
        entity: switch.greenery_s_farm_nursery_recirc_and_chiller_pump_switch
        name: Nursery Recirc + Chiller Pump
        tap_action:
          action: toggle
          confirmation:
            text: Turn Nursery Recirc and Chiller Pump on/off? Off stops chiller flow.
        icon_tap_action:
          action: toggle
          confirmation:
            text: Turn Nursery Recirc and Chiller Pump on/off? Off stops chiller flow.
        hold_action:
          action: none

  # Owner-confirmed 2026-11-05 (ch12). Task Mode only, same as the pumps:
  # manual_action bypasses whatever the recipe/HVAC logic is doing with this
  # fan while the farm is in Auto.
  - type: grid
    title: Exhaust Fan (Task Mode only)
    columns: 1
    square: false
    cards:
      - type: tile
        entity: switch.greenery_s_farm_exhaust_fan_switch
        name: Exhaust Fan
        tap_action:
          action: toggle
          confirmation:
            text: Turn the Exhaust Fan on/off?
        icon_tap_action:
          action: toggle
          confirmation:
            text: Turn the Exhaust Fan on/off?
        hold_action:
          action: none

  # farmhand's own 24-hour flags - not Task Mode. Each switch shows what the
  # Hub reports, read back every 5 minutes and after every change.
  - type: grid
    title: 24-Hour Settings
    columns: 1
    square: false
    cards:
      - type: tile
        entity: switch.greenery_s_farm_nursery_top_24_h
        name: Nursery Top 24 h
        tap_action:
          action: toggle
          confirmation:
            text: Change 24-hour lighting for the nursery TOP trough?
        icon_tap_action:
          action: toggle
          confirmation:
            text: Change 24-hour lighting for the nursery TOP trough?
        hold_action:
          action: none

      - type: tile
        entity: switch.greenery_s_farm_nursery_bottom_24_h
        name: Nursery Bottom 24 h
        tap_action:
          action: toggle
          confirmation:
            text: Change 24-hour lighting for the nursery BOTTOM trough?
        icon_tap_action:
          action: toggle
          confirmation:
            text: Change 24-hour lighting for the nursery BOTTOM trough?
        hold_action:
          action: none

      - type: tile
        entity: switch.greenery_s_farm_cultivation_watering_24_h
        name: Cultivation Watering 24 h
        tap_action:
          action: toggle
          confirmation:
            text: Change 24-hour watering for BOTH cultivation send pumps?
        icon_tap_action:
          action: toggle
          confirmation:
            text: Change 24-hour watering for BOTH cultivation send pumps?
        hold_action:
          action: none

      - type: tile
        entity: sensor.greenery_s_farm_farmhand_version
        name: farmhand version
