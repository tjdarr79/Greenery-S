# ---------------------------------------------------------------------------
# CONTROLS CARD - generic, shipped to every farm via render-farm-yaml.py.
# Exactly four controls, nothing else (owner decision 2026-11-05):
#   Task Mode (Enter / Return to Auto), Exhaust Fan, and the three 24-hour
#   settings (Nursery Top, Nursery Bottom, Cultivation Watering).
# Status, pump switches and Key Equipment are on the Task Mode dashboard
# (dashboard-task-mode.yaml); Cool-Down is in dashboard-cooldown.yaml; camera
# photos are on the main mobile dashboard. Add to this card only on request.
#
# To use as its own dashboard: Settings -> Dashboards -> Add dashboard ->
# "New dashboard from scratch", name it "Controls", open it -> pencil ->
# Add Card -> Manual, then paste this block.
#
# THREE THINGS THAT WILL BITE YOU
#
# 1. `confirmation:` is not optional. Without it a mis-tap on a phone in your
#    pocket stops the farm. It is nested INSIDE tap_action.
#
# 2. The visual editor can emit a tap_action of `automation.trigger` with an
#    empty target, which silently does nothing. A button card driving a
#    `button` entity needs `perform_action: button.press` with an explicit
#    target.entity_id, exactly as written below.
#
# 3. A tile toggles its switch on an ICON tap by default - with no
#    confirmation. Every switch tile therefore sets icon_tap_action as well as
#    tap_action, both with `confirmation:`, and hold_action: none. Keep all
#    three when editing; verify-repo.py checks the first two.
#
# "Exhaust Fan (Task Mode only)" is unavailable unless the farm is in Task
# Mode; leaving Task Mode returns the fan to farmhand's control. "24-Hour
# Settings" writes farmhand's own 24-hour flags and works in auto.
# ---------------------------------------------------------------------------

type: vertical-stack
cards:
  - type: button
    show_name: true
    show_icon: true
    entity: button.greenery_s_farm_enter_task_mode
    name: EMERGENCY — Task Mode
    icon: mdi:hand-back-right
    tap_action:
      action: perform-action
      perform_action: button.press
      target:
        entity_id: button.greenery_s_farm_enter_task_mode
      confirmation:
        text: Put the farm in TASK MODE? Lights off, recipe suspended.

  - type: button
    show_name: true
    show_icon: true
    entity: button.greenery_s_farm_exit_task_mode
    name: Return to Auto
    icon: mdi:play-circle
    tap_action:
      action: perform-action
      perform_action: button.press
      target:
        entity_id: button.greenery_s_farm_exit_task_mode
      confirmation:
        text: Return the farm to automatic recipe control?

  # Task Mode only: unavailable in Auto. Leaving Task Mode returns the
  # fan to farmhand's control.
  - type: grid
    title: Exhaust Fan (Task Mode only)
    columns: 1
    square: false
    cards:
      - type: tile
        entity: switch.greenery_s_farm_exhaust_fan_switch
        name: Exhaust Fan
        tap_action:
          action: toggle
          confirmation:
            text: Turn the Exhaust Fan on/off?
        icon_tap_action:
          action: toggle
          confirmation:
            text: Turn the Exhaust Fan on/off?
        hold_action:
          action: none

  # farmhand's own 24-hour flags - not Task Mode. Each switch shows what the
  # Hub reports, read back every 5 minutes and after every change.
  - type: grid
    title: 24-Hour Settings
    columns: 1
    square: false
    cards:
      - type: tile
        entity: switch.greenery_s_farm_nursery_top_24_h
        name: Nursery Top 24 h
        tap_action:
          action: toggle
          confirmation:
            text: Change 24-hour lighting for the nursery TOP trough?
        icon_tap_action:
          action: toggle
          confirmation:
            text: Change 24-hour lighting for the nursery TOP trough?
        hold_action:
          action: none

      - type: tile
        entity: switch.greenery_s_farm_nursery_bottom_24_h
        name: Nursery Bottom 24 h
        tap_action:
          action: toggle
          confirmation:
            text: Change 24-hour lighting for the nursery BOTTOM trough?
        icon_tap_action:
          action: toggle
          confirmation:
            text: Change 24-hour lighting for the nursery BOTTOM trough?
        hold_action:
          action: none

      - type: tile
        entity: switch.greenery_s_farm_cultivation_watering_24_h
        name: Cultivation Watering 24 h
        tap_action:
          action: toggle
          confirmation:
            text: Change 24-hour watering for BOTH cultivation send pumps?
        icon_tap_action:
          action: toggle
          confirmation:
            text: Change 24-hour watering for BOTH cultivation send pumps?
        hold_action:
          action: none
