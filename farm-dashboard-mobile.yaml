title: Greenery S Farm (Mobile)
views:
  - title: Farm Overview
    path: farm-mobile
    icon: mdi:cellphone
    cards:
      # -----------------------------------------------------------------
      # BRIDGE STATUS - check this first: if offline, everything below
      # is stale/last-known data, not live readings.
      # -----------------------------------------------------------------
      - type: entity
        card_mod: &card_style
          # Requires card-mod (HACS). Without it these lines are ignored and the
          # cards render with stock styling - nothing breaks.
          # Title size appears twice below (both copies of 28px) - change both.
          # This block is defined once and reused by every card in the file.
          style:
            .: |
              ha-card {
                border: 2px solid var(--secondary-text-color) !important;
                border-radius: 12px !important;
              }
              .card-header {
                font-weight: 700 !important;
                font-size: 28px !important;
                line-height: 1.2 !important;
              }
            ha-card$: |
              .card-header {
                font-weight: 700 !important;
                font-size: 28px !important;
                line-height: 1.2 !important;
              }
        entity: binary_sensor.greenery_s_farm_farm_bridge_status
        name: Bridge Status
        icon: mdi:connection

      # -----------------------------------------------------------------
      # ENVIRONMENTAL
      # -----------------------------------------------------------------
      - type: entities
        card_mod: *card_style
        title: Environmental
        icon: mdi:thermometer
        show_header_toggle: false
        entities:
          - entity: sensor.greenery_s_farm_farm_co2
            name: CO2
          - entity: sensor.greenery_s_farm_farm_humidity
            name: Humidity
          - entity: sensor.greenery_s_farm_farm_air_temp
            name: Air Temp

      # -----------------------------------------------------------------
      # NURSERY
      # -----------------------------------------------------------------
      - type: entities
        card_mod: *card_style
        title: Nursery
        icon: mdi:seed
        show_header_toggle: false
        entities:
          - entity: sensor.greenery_s_farm_nursery_ph
            name: pH
          - entity: sensor.greenery_s_farm_nursery_ec
            name: EC
          - entity: sensor.greenery_s_farm_nursery_water_temp
            name: Water Temp
          - entity: sensor.greenery_s_farm_nursery_depth
            name: Tank Depth

      # -----------------------------------------------------------------
      # CULTIVATION
      # -----------------------------------------------------------------
      - type: entities
        card_mod: *card_style
        title: Cultivation
        icon: mdi:water
        show_header_toggle: false
        entities:
          - entity: sensor.greenery_s_farm_cultivation_ph
            name: pH
          - entity: sensor.greenery_s_farm_cultivation_ec
            name: EC
          - entity: sensor.greenery_s_farm_cultivation_water_temp
            name: Water Temp
          - entity: sensor.greenery_s_farm_cultivation_depth_raw
            name: Tank Depth (raw - needs calibration)
          - entity: sensor.greenery_s_farm_left_send_pressure
            name: Left Send Pressure
          - entity: sensor.greenery_s_farm_right_send_pressure
            name: Right Send Pressure

      # -----------------------------------------------------------------
      # TREND GRAPHS - stacked full-width, one per zone. Side-by-side
      # columns (used on the desktop dashboard) don't work on a phone
      # screen - each needs its own row to stay readable.
      # -----------------------------------------------------------------
      - type: history-graph
        card_mod: *card_style
        title: Environmental Trends (24h)
        hours_to_show: 24
        refresh_interval: 60
        entities:
          - entity: sensor.greenery_s_farm_farm_co2
            name: CO2
          - entity: sensor.greenery_s_farm_farm_humidity
            name: Humidity
          - entity: sensor.greenery_s_farm_farm_air_temp
            name: Air Temp

      - type: history-graph
        card_mod: *card_style
        title: Nursery Trends (24h)
        hours_to_show: 24
        refresh_interval: 60
        entities:
          - entity: sensor.greenery_s_farm_nursery_ph
            name: pH
          - entity: sensor.greenery_s_farm_nursery_ec
            name: EC
          - entity: sensor.greenery_s_farm_nursery_water_temp
            name: Water Temp

      - type: history-graph
        card_mod: *card_style
        title: Cultivation Trends (24h)
        hours_to_show: 24
        refresh_interval: 60
        entities:
          - entity: sensor.greenery_s_farm_cultivation_ph
            name: pH
          - entity: sensor.greenery_s_farm_cultivation_ec
            name: EC
          - entity: sensor.greenery_s_farm_cultivation_water_temp
            name: Water Temp

      - type: history-graph
        card_mod: *card_style
        title: Tank Depth Trends (24h)
        hours_to_show: 24
        refresh_interval: 60
        entities:
          - entity: sensor.greenery_s_farm_nursery_depth
            name: Nursery Depth
          - entity: sensor.greenery_s_farm_cultivation_depth_raw
            name: Cultivation Depth (raw)
