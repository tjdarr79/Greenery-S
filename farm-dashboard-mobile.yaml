title: Greenery S Farm (Mobile)
views:
  - title: Farm Overview
    path: farm-mobile
    icon: mdi:cellphone
    cards:
      # -----------------------------------------------------------------
      # BRIDGE STATUS - check this first: if offline, everything below
      # is stale/last-known data, not live readings.
      # -----------------------------------------------------------------
      - type: entity
        entity: binary_sensor.greenery_s_farm_farm_bridge_status
        name: Bridge Status
        icon: mdi:connection

      # -----------------------------------------------------------------
      # FARM LOGO - optional. Upload the image as /config/www/farm-logo.png
      # (File Editor -> www folder -> upload; restart Home Assistant once if
      # the www folder is new). No logo: delete this card.
      # -----------------------------------------------------------------
      - type: picture
        image: /local/farm-logo.png
        tap_action:
          action: none
        hold_action:
          action: none

      # -----------------------------------------------------------------
      # ENVIRONMENTAL
      # -----------------------------------------------------------------
      - type: entities
        title: Environmental
        icon: mdi:thermometer
        show_header_toggle: false
        entities:
          - entity: sensor.greenery_s_farm_farm_co2
            name: CO2
          - entity: sensor.greenery_s_farm_farm_humidity
            name: Humidity
          - entity: sensor.greenery_s_farm_farm_air_temp
            name: Air Temp

      # DOSING TANKS - farmhand shows these under air temp / RH / CO2.
      # OK, or Problem (red) when a tank is low. A dead or unplugged sensor
      # ALSO reads OK: look at the tanks when you top them off. Refill tracking
      # (Days Since Refill, Refilled buttons) is left off this card; see DOCS.md,
      # "Dosing tank levels", to add it back.
      - type: entities
        title: Dosing Tanks
        icon: mdi:cup-water
        state_color: true
        show_header_toggle: false
        entities:
          - entity: binary_sensor.greenery_s_farm_nutrient_a_level
            name: Nutrient A
          - entity: binary_sensor.greenery_s_farm_nutrient_b_level
            name: Nutrient B
          - entity: binary_sensor.greenery_s_farm_ph_down_level
            name: pH Down
          - entity: binary_sensor.greenery_s_farm_boost_ph_up_level
            name: Boost / pH Up
          # A flickering sensor (corroded connector) - shown only while it is on.
          - type: conditional
            conditions:
              - entity: binary_sensor.greenery_s_farm_nutrient_a_sensor_fault
                state: "on"
            row:
              entity: binary_sensor.greenery_s_farm_nutrient_a_sensor_fault
              name: Nutrient A sensor unstable
          - type: conditional
            conditions:
              - entity: binary_sensor.greenery_s_farm_nutrient_b_sensor_fault
                state: "on"
            row:
              entity: binary_sensor.greenery_s_farm_nutrient_b_sensor_fault
              name: Nutrient B sensor unstable
          - type: conditional
            conditions:
              - entity: binary_sensor.greenery_s_farm_ph_down_sensor_fault
                state: "on"
            row:
              entity: binary_sensor.greenery_s_farm_ph_down_sensor_fault
              name: pH Down sensor unstable
          - type: conditional
            conditions:
              - entity: binary_sensor.greenery_s_farm_boost_ph_up_sensor_fault
                state: "on"
            row:
              entity: binary_sensor.greenery_s_farm_boost_ph_up_sensor_fault
              name: Boost / pH Up sensor unstable

      # -----------------------------------------------------------------
      # NURSERY CAMERAS - latest photo each (farmhand takes one every 3 h).
      # Tap for full size. While this dashboard is open Home Assistant
      # re-reads the photos every 10 s: close it when on cellular.
      # -----------------------------------------------------------------
      - type: grid
        columns: 2
        square: false
        cards:
          - type: picture-entity
            entity: camera.greenery_s_farm_nursery_top_camera
            name: Nursery Top
            show_state: false
            tap_action:
              action: more-info
            hold_action:
              action: none
          - type: picture-entity
            entity: camera.greenery_s_farm_nursery_bottom_camera
            name: Nursery Bottom
            show_state: false
            tap_action:
              action: more-info
            hold_action:
              action: none

      # -----------------------------------------------------------------
      # NURSERY
      # -----------------------------------------------------------------
      - type: entities
        title: Nursery
        icon: mdi:seed
        show_header_toggle: false
        entities:
          - entity: sensor.greenery_s_farm_nursery_ph
            name: pH
          - entity: sensor.greenery_s_farm_nursery_ec
            name: EC
          - entity: sensor.greenery_s_farm_nursery_water_temp
            name: Water Temp
          - entity: sensor.greenery_s_farm_nursery_depth
            name: Tank Depth

      # -----------------------------------------------------------------
      # CULTIVATION CAMERAS, left to right - latest photo each (farmhand takes one every 3 h).
      # Tap for full size. While this dashboard is open Home Assistant
      # re-reads the photos every 10 s: close it when on cellular.
      # -----------------------------------------------------------------
      - type: grid
        columns: 2
        square: false
        cards:
          - type: picture-entity
            entity: camera.greenery_s_farm_cultivation_left_camera
            name: Left
            show_state: false
            tap_action:
              action: more-info
            hold_action:
              action: none
          - type: picture-entity
            entity: camera.greenery_s_farm_cultivation_left_middle_camera
            name: Left Middle
            show_state: false
            tap_action:
              action: more-info
            hold_action:
              action: none
          - type: picture-entity
            entity: camera.greenery_s_farm_cultivation_right_middle_camera
            name: Right Middle
            show_state: false
            tap_action:
              action: more-info
            hold_action:
              action: none
          - type: picture-entity
            entity: camera.greenery_s_farm_cultivation_right_camera
            name: Right
            show_state: false
            tap_action:
              action: more-info
            hold_action:
              action: none

      # -----------------------------------------------------------------
      # CULTIVATION
      # -----------------------------------------------------------------
      - type: entities
        title: Cultivation
        icon: mdi:water
        show_header_toggle: false
        entities:
          - entity: sensor.greenery_s_farm_cultivation_ph
            name: pH
          - entity: sensor.greenery_s_farm_cultivation_ec
            name: EC
          - entity: sensor.greenery_s_farm_cultivation_water_temp
            name: Water Temp
          - entity: sensor.greenery_s_farm_cultivation_depth_raw
            name: Tank Depth (raw - needs calibration)
          - entity: sensor.greenery_s_farm_left_send_pressure
            name: Left Send Pressure
          - entity: sensor.greenery_s_farm_right_send_pressure
            name: Right Send Pressure

      # -----------------------------------------------------------------
      # TREND GRAPHS - stacked full-width, one per zone. Side-by-side
      # columns (used on the desktop dashboard) don't work on a phone
      # screen - each needs its own row to stay readable.
      # -----------------------------------------------------------------
      - type: history-graph
        title: Environmental Trends (24h)
        hours_to_show: 24
        refresh_interval: 60
        entities:
          - entity: sensor.greenery_s_farm_farm_co2
            name: CO2
          - entity: sensor.greenery_s_farm_farm_humidity
            name: Humidity
          - entity: sensor.greenery_s_farm_farm_air_temp
            name: Air Temp

      - type: history-graph
        title: Nursery Trends (24h)
        hours_to_show: 24
        refresh_interval: 60
        entities:
          - entity: sensor.greenery_s_farm_nursery_ph
            name: pH
          - entity: sensor.greenery_s_farm_nursery_ec
            name: EC
          - entity: sensor.greenery_s_farm_nursery_water_temp
            name: Water Temp

      - type: history-graph
        title: Cultivation Trends (24h)
        hours_to_show: 24
        refresh_interval: 60
        entities:
          - entity: sensor.greenery_s_farm_cultivation_ph
            name: pH
          - entity: sensor.greenery_s_farm_cultivation_ec
            name: EC
          - entity: sensor.greenery_s_farm_cultivation_water_temp
            name: Water Temp

      - type: history-graph
        title: Tank Depth Trends (24h)
        hours_to_show: 24
        refresh_interval: 60
        entities:
          - entity: sensor.greenery_s_farm_nursery_depth
            name: Nursery Depth
          - entity: sensor.greenery_s_farm_cultivation_depth_raw
            name: Cultivation Depth (raw)
