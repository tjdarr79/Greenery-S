alias: Farm EC Critical
description: EC above 3000 - documented signal for algae/debris on sensor or a clog
triggers:
  - entity_id:
      - sensor.greenery_s_farm_cultivation_ec
      - sensor.greenery_s_farm_nursery_ec
    above: 3000
    for:
      minutes: 5
    trigger: numeric_state
actions:
  - data:
      title: ⚠️ EC Critical
      message: >-
        {{ trigger.to_state.name }} is at {{ trigger.to_state.state }}
        µS/cm - check for algae/debris on the sensor or a clog
        restricting flow.
    action: notify.mobile_app_farm_phone
mode: single
