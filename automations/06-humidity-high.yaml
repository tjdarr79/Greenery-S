alias: Farm Humidity High
description: Humidity at or above 80%
triggers:
  - entity_id: sensor.greenery_s_farm_farm_humidity
    above: 80
    for:
      minutes: 5
    trigger: numeric_state
actions:
  - action: script.farm_alerts
    continue_on_error: true
    data:
      title: ⚠️ Farm Humidity High
      notification_id: farm_humidity_high
      message: >-
        Humidity is at {{ trigger.to_state.state }}% - at or above the 80%
        threshold.
mode: single
