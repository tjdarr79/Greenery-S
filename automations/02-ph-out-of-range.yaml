alias: Farm pH Out of Range
description: >-
  pH below 5.4 or above 6.4 in either zone. Working target for lettuce and
  brassicas is 5.5-6.2; above ~6.5 iron and manganese availability
  collapses. Previous band (5.0-7.75) was wide enough to permit chronic
  deficiency with no alert.
triggers:
  - entity_id:
      - sensor.greenery_s_farm_cultivation_ph
      - sensor.greenery_s_farm_nursery_ph
    below: 5.4
    for:
      minutes: 5
    trigger: numeric_state
  - entity_id:
      - sensor.greenery_s_farm_cultivation_ph
      - sensor.greenery_s_farm_nursery_ph
    above: 6.4
    for:
      minutes: 5
    trigger: numeric_state
actions:
  - action: script.farm_alerts
    continue_on_error: true
    data:
      title: ⚠️ pH Out of Range
      notification_id: farm_ph_out_of_range
      message: >-
        {{ trigger.to_state.name }} is at {{ trigger.to_state.state }} -
        outside the 5.4-6.4 range. Target is 5.5-6.2. Check calibration or
        the dosing system.
mode: single
