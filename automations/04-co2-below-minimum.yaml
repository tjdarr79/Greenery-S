alias: Farm CO2 Below Minimum
description: >-
  CO2 below 500 ppm - tank likely empty, plants at risk of starvation
  within roughly 1 hour based on observed decline rate
triggers:
  - entity_id: sensor.greenery_s_farm_farm_co2
    below: 500
    for:
      minutes: 5
    trigger: numeric_state
actions:
  - data:
      title: ⚠️ CO2 Below Minimum
      message: >-
        CO2 is at {{ trigger.to_state.state }} ppm - below 500 ppm.
        Check CO2 controller/injection.
    action: notify.mobile_app_farm_phone
mode: single
