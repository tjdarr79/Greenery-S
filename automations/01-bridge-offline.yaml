alias: Farm Bridge Offline
description: >-
  Bridge lost connection - no other farm alerts are reliable until this
  clears. This is the watchdog for the entire pipeline: if it cannot
  notify, nothing can.
triggers:
  - entity_id: binary_sensor.greenery_s_farm_farm_bridge_status
    to: "off"
    for:
      minutes: 5
    trigger: state
actions:
  - action: script.farm_alerts
    continue_on_error: true
    data:
      title: ⚠️ Farm Bridge Offline
      notification_id: farm_bridge_offline
      message: >-
        The HA monitoring bridge has been disconnected for 5+ minutes.
        Sensor data may be stale. Check the farm PC.
mode: single
