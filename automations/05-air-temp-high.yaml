alias: Farm Air Temp High
description: >-
  Air temp at or above 80°F - HVAC can no longer keep up at this point;
  matches Farmhand's own logic for when lights should be turned off.
  Short 1-minute window is intentional: this is an emergency-response
  alert, not a routine watch alert.
triggers:
  - entity_id: sensor.greenery_s_farm_farm_air_temp
    above: 80
    for:
      minutes: 1
    trigger: numeric_state
actions:
  - action: script.farm_alerts
    continue_on_error: true
    data:
      title: ⚠️ Farm Air Temp High
      notification_id: farm_air_temp_high
      message: >-
        Air temp is at {{ trigger.to_state.state }}°F - at or above the 80°F
        threshold. HVAC may not be keeping up. Consider turning off lights.
mode: single
